<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      font-family: sans-serif;
      width: 200px;
      padding: 16px;
      margin: 0;
      text-align: center;
    }
    button {
      width: 100%;
      padding: 8px 0;
      font-size: 14px;
      cursor: pointer;
      border: none;
      border-radius: 4px;
      background: #1a73e8;
      color: #fff;
    }
    button:disabled {
      background: #aaa;
      cursor: default;
    }
    #status {
      margin-top: 10px;
      font-size: 13px;
      min-height: 18px;
      color: #555;
    }
    #status.error { color: #c00; }
    #status.success { color: #0a0; }
  </style>
</head>
<body>
  <button id="btn">Capture Page</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
